# Data Source Registry
# Documents all external data sources, their licensing terms, and usage constraints

sources:
  musicbrainz:
    name: MusicBrainz
    url: https://musicbrainz.org/
    api_url: https://musicbrainz.org/ws/2/
    documentation: https://musicbrainz.org/doc/MusicBrainz_API
    license: CC0 / Public Domain
    rate_limit: 1 request per second
    auth_required: false
    data_type: canonical_artist_identity, releases, metadata
    limitations:
      - Maximum 1 API call per second per application
      - Community-maintained data
      - Not a direct popularity measure
    commercial_use: allowed
    attribution_required: true

  wikidata:
    name: Wikidata
    url: https://www.wikidata.org/
    api_url: https://www.wikidata.org/wiki/Special:ApiSandbox
    documentation: https://www.wikidata.org/wiki/Wikidata:Data_access
    license: CC0
    rate_limit: none_specified
    auth_required: false
    data_type: genres, locations, memberships, identifiers, dates
    limitations:
      - Incomplete and community-maintained
      - Entity disambiguation required
    commercial_use: allowed
    attribution_required: true

  setlistfm:
    name: setlist.fm
    url: https://www.setlist.fm/
    api_url: https://api.setlist.fm/docs/1.0/index.html
    documentation: https://api.setlist.fm/docs/1.0/index.html
    license: API-specific terms
    rate_limit: requires_api_key
    auth_required: true
    data_type: concert_history, setlists, venue history
    limitations:
      - Community-generated and incomplete
      - Requires API key application
    commercial_use: check_terms
    attribution_required: true

  ticketmaster:
    name: Ticketmaster Discovery API
    url: https://developer.ticketmaster.com/
    api_url: https://app.ticketmaster.com/discovery/v2/
    documentation: https://developer.ticketmaster.com/products-and-docs/apis/discovery-api/v2/
    license: API-specific terms
    rate_limit: 5000 calls daily default
    auth_required: true
    data_type: events, venues, attractions, dates, price ranges
    limitations:
      - No dependable sales velocity
      - No complete inventory
      - Rate limited
    commercial_use: check_terms
    attribution_required: true

  youtube:
    name: YouTube Data API
    url: https://developers.google.com/youtube/v3
    api_url: https://www.googleapis.com/youtube/v3/
    documentation: https://developers.google.com/youtube/v3/getting-started
    license: Google API Terms of Service
    rate_limit: 10000 units daily default
    auth_required: true
    data_type: views, likes, comments, channel stats, video stats
    limitations:
      - Quotas and platform-policy constraints
      - Separate limits for certain endpoints
      - February 2026 dev mode changes
    commercial_use: check_terms
    attribution_required: true

  wikimedia:
    name: Wikimedia Pageviews
    url: https://wikitech.wikimedia.org/wiki/Analytics/Data/Pageviews
    api_url: https://pageviews.wmflabs.org/
    documentation: https://wikitech.wikimedia.org/wiki/Analytics/Data/Pageviews
    license: CC0
    rate_limit: none_specified
    auth_required: false
    data_type: daily pageviews for artists and festivals
    limitations:
      - Attention is not equivalent to purchase intent
      - Wikipedia-specific bias
    commercial_use: allowed
    attribution_required: true

  gdelt:
    name: GDELT Project
    url: https://www.gdeltproject.org/
    api_url: https://api.gdeltproject.org/api/v2/
    documentation: https://www.gdeltproject.org/data.html
    license: CC0
    rate_limit: none_specified
    auth_required: false
    data_type: news volume, tone, entities, article search
    limitations:
      - Noisy data
      - Entity disambiguation necessary
    commercial_use: allowed
    attribution_required: true

  nws:
    name: National Weather Service
    url: https://www.weather.gov/
    api_url: https://www.weather.gov/documentation/services-web-api
    documentation: https://www.weather.gov/documentation/services-web-api
    license: Public domain (U.S. government)
    rate_limit: none_specified
    auth_required: false
    data_type: forecasts, alerts, observations
    limitations:
      - Primarily strongest for U.S. use
      - Forecast uncertainty
    commercial_use: allowed
    attribution_required: true

  noaa_ncei:
    name: NOAA NCEI
    url: https://www.ncei.noaa.gov/
    api_url: https://www.ncdc.noaa.gov/cdo-web/
    documentation: https://www.ncdc.noaa.gov/cdo-web/webservices/v2
    license: Public domain (U.S. government)
    rate_limit: none_specified
    auth_required: false
    data_type: historical weather data
    limitations:
      - Geographic and publication lags
      - Historical only
    commercial_use: allowed
    attribution_required: true

  bts:
    name: Bureau of Transportation Statistics
    url: https://www.transtats.bts.gov/
    api_url: https://www.transtats.bts.gov/DataInfo.asp
    documentation: https://www.transtats.bts.gov/TableInfo.asp
    license: Public domain (U.S. government)
    rate_limit: none_specified
    auth_required: false
    data_type: passenger volume, capacity, routes, fares
    limitations:
      - Historical and delayed
      - Not live flight-shopping demand
    commercial_use: allowed
    attribution_required: true

  census:
    name: U.S. Census Bureau
    url: https://www.census.gov/
    api_url: https://api.census.gov/
    documentation: https://api.census.gov/data.html
    license: Public domain (U.S. government)
    rate_limit: none_specified
    auth_required: false
    data_type: population, age, income, housing, demographics
    limitations:
      - Geographic and publication lags
      - U.S.-focused
    commercial_use: allowed
    attribution_required: true

  bea:
    name: Bureau of Economic Analysis
    url: https://apps.bea.gov/
    api_url: https://apps.bea.gov/api/signup/
    documentation: https://apps.bea.gov/api/signup/
    license: Public domain (U.S. government)
    rate_limit: requires_api_key
    auth_required: true
    data_type: regional income, employment, GDP, price parity
    limitations:
      - Geographic and publication lags
      - Requires API key
    commercial_use: allowed
    attribution_required: true

  bls:
    name: Bureau of Labor Statistics
    url: https://www.bls.gov/
    api_url: https://api.bls.gov/publicAPI/v2/
    documentation: https://www.bls.gov/developers/
    license: Public domain (U.S. government)
    rate_limit: requires_api_key
    auth_required: true
    data_type: labor market time series
    limitations:
      - Publication lags
      - Requires API key
    commercial_use: allowed
    attribution_required: true

  openstreetmap:
    name: OpenStreetMap
    url: https://www.openstreetmap.org/
    api_url: https://overpass-api.de/api/
    documentation: https://wiki.openstreetmap.org/wiki/Overpass_API
    license: ODbL (Open Database License)
    rate_limit: none_specified
    auth_required: false
    data_type: hotels, venues, transit, geographic features
    limitations:
      - Room counts and capacity fields inconsistent
      - Community-maintained
    commercial_use: allowed_with_attribution
    attribution_required: true

sources_not_recommended:
  spotify:
    reason: February 2026 development-mode changes require Premium for development use and impose client, user, and endpoint restrictions. Acceptable as optional enrichment but not foundational.

  lastfm:
    reason: Documentation instructs commercial and research users to contact the company before using the API. Free developer key does not create unrestricted startup rights.

  twitter:
    reason: API now presented through pay-per-use model. Poor foundation for external analytics product.

  reddit:
    reason: Access and policy stability are poor foundations for external analytics product.

  tiktok:
    reason: Research access requires eligibility, application, and approval for specific research project.

  openmeteo:
    reason: Free hosted service limited to noncommercial use. Server software can be self-hosted but hosted API should not be commercial foundation.
