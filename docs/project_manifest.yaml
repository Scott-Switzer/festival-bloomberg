providers:
  # status taxonomy: PUBLIC_NO_AUTH | AUTH_CONFIGURED | AUTH_MISSING |
  #                  OPERATIONAL | NOT_IMPLEMENTED | DISABLED_RIGHTS
  nws: "PUBLIC_NO_AUTH / OPERATIONAL (api.weather.gov forecasts)"
  wikimedia: "PUBLIC_NO_AUTH / OPERATIONAL (pageviews)"
  commoncrawl: "PUBLIC_NO_AUTH / OPERATIONAL (URL index + CDX)"
  listenbrainz: "PUBLIC_NO_AUTH / OPERATIONAL (artist listeners stats keyed by MBID; LISTENBRAINZ_LISTEN_COUNT/LISTENER_COUNT; CC0 attention sample)"
  gdelt: "PUBLIC_NO_AUTH / OPERATIONAL (DOC artlist metadata-only news; >=1 req/5s; no article text)"
  ticketmaster: "AUTH (discovery API, DMA-partitioned US music)"
  youtube: "AUTH (video stats + comments)"
  setlistfm: "AUTH (noncommercial unless arranged)"
  spotify: "AUTH_CONFIGURED / OPERATIONAL (client-credentials Web API; 2026 catalog-only fields id/name/external_urls/images/type/uri — no popularity/followers/genres)"
  soloist: "IDENTIFIED_CREDENTIAL / NOT_WIRED (spak_ key; separate Spotify product surface, endpoint contract unresolved — never sent to Web API)"
  nvidia: "AUTH (OpenAI-compatible NIM; prototyping/research)"
  seatgeek: "AUTOMATION=DISABLED; RIGHTS=TERMS_REVIEW_REQUIRED; COMMERCIAL_USE=TERMS_REVIEW_REQUIRED; RESEARCH_USE=TERMS_REVIEW_REQUIRED"

