# Festival Intelligence — project capability manifest (machine-readable).
# This is an orientation map for coding/research agents, NOT a source of truth
# for data. Counts are approximate; run `context_snapshot` for live values.
# No secret values belong in this file.

project:
  mission: "Quantitative information infrastructure for live entertainment."
  product: "Read-only information terminal (search, tape, entity pages, ASK)."

architecture:
  warehouse: "DuckDB (schema/duckdb.sql + schema/migrations/*.sql)"
  research_db: "data/warehouse/boxoffice_research_v2.duckdb"
  acquisition: "python/festival_bloomberg/acquisition/"
  flywheel: "python/festival_bloomberg/flywheel/"
  festival_spine: "python/festival_bloomberg/festivals/ (core.festival_*)"
  terminal: "python/festival_bloomberg/terminal/ + apps/terminal/static/"
  config: "python/festival_bloomberg/localenv.py + config.py"

semantics:
  - "UNKNOWN != 0"
  - "announcement != booking != onsale"
  - "capacity != attendance"
  - "archive capture time != publication time"
  - "conflicting claims coexist"
  - "models propose evidence; deterministic code decides admissibility"

milestones:
  BASELINE_RESEARCH_V1: "COMPS_SIGNAL_ONLY (negative result preserved)"
  DATA_FLYWHEEL_AND_COVERAGE_V1: "PASS"
  DATA_ACQUISITION_ACTIVATION_V1: "PARTIAL (forward watch + hunt execution real; strict PIT warm-start = 0)"
  PRE_EVENT_CUTOFF_ACQUISITION_V1: "PARTIAL (cutoff taxonomy; historical decision cutoffs = 0)"
  HISTORICAL_DECISION_EVIDENCE_ENGINE_V1: "PARTIAL (VOI priority + claim graph; acquisition gated on discovery source)"
  FESTIVAL_INTELLIGENCE_TERMINAL_MVP_V1: "PARTIAL (product PASS; live data expansion gated on keys)"
  INTELLIGENCE_DATA_ESTATE_AND_FESTIVAL_SPINE_V1: "PARTIAL (festival spine + provider repair + agent memory PASS; Spotify Web API operational; keyed live ingestion remains)"
  LIVE_ENTERTAINMENT_DATA_FABRIC_V1: "PARTIAL (Wikimedia attention + 17-market Ticketmaster sweep + partition manifest real; GDELT rate-limited; date-window subdivision remains)"
  NATIONAL_COVERAGE_ENTITY_MASTER_AND_FESTIVAL_HISTORY_V1: "PARTIAL (Ticketmaster recursive date-window subdivision -> 14,023 events / 0 truncated leaves; promoter + resolution-ledger schema; ListenBrainz provider operational; MBID spine + festival-history scale remain)"
  MUSIC_SECURITY_MASTER_AND_MONITORING_V1: "PARTIAL (music entity master + relationship graph + external-ID master schema; MusicBrainz CC0 bulk series ingest -> 6,228 festival/tour/residency series; MBID resolution + catalog + monitoring remain)"
  MUSIC_REFERENCE_GRAPH_AND_PRO_WORKFLOW_V1: "PARTIAL (event + place dumps turn series spine into a connected graph; artist-dump MBID resolution, ListenBrainz live coverage, and monitoring remain)"
  MUSIC_TERMINAL_PRODUCTIZATION_V1: "PASS (PR #31 merged; identity + ListenBrainz + watchlists + monitors + alerts + TODAY + search + ART/FEST/TOUR/MKT/DATA/ASK; 537 tests)"
  OSS_PLATFORM_EVALUATION_V1: "PASS (evaluation, not adoption: Memray profiling + Splink_NAME_ONLY=NOT_ADOPTED + Dagster offline parity PASS but REJECTED_FOR_NOW + OpenLineage file proof PASS but REJECTED_FOR_NOW + Crawlee/dlt rejected; no forced adoption)"
  COMPARABLE_EVENT_ENGINE_V1: "PASS_RESEARCH_FRAMEWORK_CHAMPION_UNCHANGED (leakage-repaired decomposable comparable distance + hierarchical strata; hierarchical median champion retained; gross-only TIME win is real but not a promotion)"
  TALENT_BUYER_WORKBENCH_V1: "PASS_WORKFLOW_RESEARCH_ONLY (PR #34 merged; BUILD/COMPARE SPA + scorecards + shortlists + scenario board + conflict warnings; dense data panel and comparable V2 remain)"
  DENSE_PRE_EVENT_DATA_PANEL_V1: "PASS_MEASURED (PR #35; 11-feature admission matrix REGENERATED with real measurements; 4 features ADMITTED across 2 independent families; Wikimedia attention 45.6% TIME + competition 100% events; venue capacity 0% REJECTED; Comparable V2 gate FIRES)"
  DESIGN_PARTNER_DATA_ACTIVATION_V1: "PASS_ONBOARDING_INFRASTRUCTURE (PR #36 merged; one-command isolated partner preview CLI + breadth-gated readiness tiers + synthetic value curves + onboarding package)"
  TERMINAL_SERVING_SNAPSHOT_V1: "PASS (PR #37; real 4.93 GiB canonical -> immutable serving snapshot VERIFIED; 23/23 serving tests + 608 Python + 76 Node; C3 buyer-morning acceptance PASS; concurrent canonical write + N→N+1 generational PASS; terminal zero canonical file handles")
  SHOW_ECONOMICS_WORKBENCH_V1: "SPEC_ONLY (deterministic show/offer economics research; not implemented)"

providers:
  # status taxonomy: PUBLIC_NO_AUTH | AUTH_CONFIGURED | AUTH_MISSING |
  #                  OPERATIONAL | NOT_IMPLEMENTED | DISABLED_RIGHTS
  nws: "PUBLIC_NO_AUTH / OPERATIONAL (api.weather.gov forecasts)"
  wikimedia: "PUBLIC_NO_AUTH / OPERATIONAL (pageviews)"
  commoncrawl: "PUBLIC_NO_AUTH / OPERATIONAL (URL index + CDX)"
  listenbrainz: "PUBLIC_NO_AUTH / OPERATIONAL (artist listeners stats keyed by MBID; LISTENBRAINZ_LISTEN_COUNT/LISTENER_COUNT; CC0 attention sample)"
  gdelt: "PUBLIC_NO_AUTH / OPERATIONAL (DOC artlist metadata-only news; >=1 req/5s; no article text)"
  ticketmaster: "AUTH (discovery API, DMA-partitioned US music)"
  youtube: "AUTH (video stats + comments)"
  setlistfm: "AUTH (noncommercial unless arranged)"
  spotify: "AUTH_CONFIGURED / OPERATIONAL (client-credentials Web API; 2026 catalog-only fields id/name/external_urls/images/type/uri — no popularity/followers/genres)"
  soloist: "IDENTIFIED_CREDENTIAL / NOT_WIRED (spak_ key; separate Spotify product surface, endpoint contract unresolved — never sent to Web API)"
  nvidia: "AUTH (OpenAI-compatible NIM; prototyping/research)"
  seatgeek: "DISABLED_RIGHTS (automated ingestion terms)"

