key_commands:
  context: "PYTHONPATH=python .venv/bin/python -m festival_bloomberg.ops.context_snapshot"
  python_tests: ".venv/bin/python -m pytest tests/python -q"
  oa: "PYTHONPATH=python .venv/bin/python -m festival_bloomberg.oa.data_estate"
  terminal: "PYTHONPATH=python .venv/bin/python -m festival_bloomberg.terminal.server --port 8931"
