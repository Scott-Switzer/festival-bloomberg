name: Festival Bloomberg CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Run test suite (offline)
        env:
          # Neutralize any inherited PYTHONPATH from the host/agent environment
          # so the project's own venv is authoritative.
          PYTHONPATH: ""
          ENVIRONMENT: development
        run: |
          source venv/bin/activate
          python -m pytest tests/ -q --cov=warehouse --cov=apps --cov=c3 --cov=backtest --cov=governance

  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck scraper contracts
        run: npm run typecheck

      - name: Run scraper contract tests
        run: npm test
