name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Python test suite
        env:
          # Explicit bloomberg path — do not use festival_intelligence defaults.
          FESTIVAL_BLOOMBERG_DUCKDB_PATH: ${{ runner.temp }}/festival_bloomberg.duckdb
          PYTHONPATH: python
        run: |
          python -m pytest tests/python -q
