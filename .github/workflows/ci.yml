name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run Python acceptance suite
        env:
          # Explicit bloomberg path — do not use festival_intelligence defaults.
          FESTIVAL_BLOOMBERG_DUCKDB_PATH: ${{ runner.temp }}/festival_bloomberg.duckdb
          PYTHONPATH: python
        run: |
          # The canonical suite: unit, migration, PIT integration, ticket-spread,
          # acquisition contract, dedup, sentiment, source-policy, prompt-injection
          # boundary and CLI tests. All tests run offline; none make paid calls.
          python -m pytest tests/python -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan (gitleaks, working tree)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.4/gitleaks_8.21.4_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          # --no-git scans the working tree (PR contents) without failing on
          # historical findings; historical exposure is tracked in SECURITY.md.
          ./gitleaks detect --source . --no-git --no-banner --redact
