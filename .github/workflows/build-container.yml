name: Build Container Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud-runtime/docker/**'
      - 'cloud-runtime/src/**'
      - 'python/festival_bloomberg/cloud/**'
      - 'requirements.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud-runtime/package-lock.json

      - name: Install dependencies
        working-directory: cloud-runtime
        run: npm ci

      - name: Typecheck
        working-directory: cloud-runtime
        run: npx tsc --noEmit

      - name: Deploy worker + build container
        working-directory: cloud-runtime
        run: npx wrangler deploy --containers-rollout=immediate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
