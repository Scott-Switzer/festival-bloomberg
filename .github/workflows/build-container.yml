name: Build Container Image

on:
  workflow_dispatch:
  push:
    branches: [feat/artist-security-25000-database-v1]
    paths:
      - 'cloud-runtime/docker/Dockerfile.batch'
      - 'cloud-runtime/docker/batch_entrypoint.py'
      - 'cloud-runtime/src/batch-container-do.ts'
      - 'cloud-runtime/src/batch-spec.ts'
      - 'cloud-runtime/src/batch-auth.ts'
      - 'python/festival_bloomberg/cloud/**'
      - 'requirements.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud-runtime/package-lock.json

      - name: Install dependencies
        working-directory: cloud-runtime
        run: npm ci

      - name: Typecheck
        working-directory: cloud-runtime
        run: npx tsc --noEmit

      - name: Build batch container image
        working-directory: cloud-runtime
        run: npx wrangler containers build docker/Dockerfile.batch -t festival-bloomberg-batch:latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Push to Cloudflare registry
        working-directory: cloud-runtime
        run: npx wrangler containers push festival-bloomberg-batch:latest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
