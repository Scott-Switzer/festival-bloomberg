name: Build Container Image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'cloud-runtime/docker/**'
      - 'cloud-runtime/src/**'
      - 'python/festival_bloomberg/cloud/**'
      - 'requirements.txt'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cloud-runtime/package-lock.json

      - name: Install dependencies
        working-directory: cloud-runtime
        run: npm ci

      - name: Typecheck
        working-directory: cloud-runtime
        run: npx tsc --noEmit

      - name: Assemble container build context
        # Wrangler uses the Dockerfile's directory as the build context,
        # so the repo-root inputs the batch image needs are copied in here.
        working-directory: cloud-runtime
        run: |
          cp -r ../python docker/python
          cp -r ../scripts docker/scripts
          cp -r ../schema docker/schema
          cp ../requirements.txt docker/requirements.txt
          python - <<'PYBUILD'
          import json, os
          from pathlib import Path
          Path("docker/build_identity.json").write_text(json.dumps({
              "git_commit": os.environ["GITHUB_SHA"],
              "build_identity": "github-actions:" + os.environ["GITHUB_RUN_ID"] + ":" + os.environ["GITHUB_RUN_ATTEMPT"],
          }, sort_keys=True))
          PYBUILD

      - name: Deploy worker + build container
        working-directory: cloud-runtime
        run: npx wrangler deploy --containers-rollout=immediate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
