# Festival Bloomberg — Hosted Terminal Production Deploy
#
# Manual + environment-gated deploy of the read-only terminal runtime to
# Cloudflare as festival-bloomberg-terminal-production. The `production`
# GitHub environment requires an approving reviewer before deployment runs.

name: Terminal Production Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: terminal-runtime/package-lock.json

      - name: Install dependencies
        working-directory: terminal-runtime
        run: npm ci

      - name: Typecheck
        working-directory: terminal-runtime
        run: npm run typecheck

      - name: Assemble deploy context
        working-directory: terminal-runtime
        run: |
          set -euo pipefail
          mkdir -p public docker
          cp -r ../apps/terminal/mvp/. public/
          cp -r ../python docker/python
          cp -r public docker/public
          cp ../requirements.txt docker/requirements.txt
          test -f public/index.html
          test -f docker/Dockerfile.terminal
          test -f docker/public/index.html
          test -f docker/requirements.txt

      - name: Deploy production terminal (festival-bloomberg-terminal-production)
        working-directory: terminal-runtime
        id: deploy
        run: |
          set -euo pipefail
          # --containers-rollout=immediate forces the long-lived DO container
          # instance to be replaced with the newly built image instead of
          # serving stale code after an image-only rebuild.
          npx wrangler deploy --env production --containers-rollout=immediate 2>&1 | tee /tmp/wrangler-deploy.log
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -1 || true)"
          if [ -z "$URL" ]; then
            echo "WRANGLER_URL_NOT_FOUND: deploy did not return a workers.dev URL" >&2
            exit 1
          fi
          echo "PRODUCTION_URL=$URL"
          echo "PRODUCTION_URL=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify production fail-closed boundary
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.PRODUCTION_URL }}"
          for path in / /health /api/status; do
            code="$(curl -sS --max-time 30 -o /tmp/fail_closed.json -w '%{http_code}' "$URL$path" || true)"
            if [ "$code" != "401" ] || ! grep -q "TERMINAL_AUTH_REQUIRED" /tmp/fail_closed.json 2>/dev/null; then
              echo "PRODUCTION_FAIL_CLOSED_FAILED path=$path code=$code" >&2
              head -c 400 /tmp/fail_closed.json >&2 || true
              exit 1
            fi
          done
          echo "PRODUCTION_FAIL_CLOSED=PASS"

      - name: Verify authorized production health and status
        env:
          TERMINAL_ACCESS_PATH: ${{ secrets.TERMINAL_ACCESS_PATH }}
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.PRODUCTION_URL }}"
          if [ -z "${TERMINAL_ACCESS_PATH:-}" ]; then
            echo "TERMINAL_ACCESS_PATH secret is required for production authorized smoke." >&2
            exit 1
          fi
          ACCESS_PATH="${TERMINAL_ACCESS_PATH#/}"
          AUTH_BASE="$URL/$ACCESS_PATH"
          for i in $(seq 1 60); do
            code="$(curl -sS --max-time 30 -o /tmp/health.json -w '%{http_code}' "$AUTH_BASE/health" || true)"
            if [ "$code" = "200" ]; then
              break
            fi
            echo "waiting for authorized terminal cold start (attempt $i, code=$code)..."
            sleep 20
          done
          if [ "${code:-}" != "200" ]; then
            echo "PRODUCTION_AUTHORIZED_HEALTH_TIMEOUT code=${code:-none}" >&2
            head -c 400 /tmp/health.json >&2 || true
            exit 1
          fi
          node -e 'const fs=require("fs"); const h=JSON.parse(fs.readFileSync("/tmp/health.json","utf8")); if(h.status!=="ok" || !h.generation || !h.sha256) { console.error(h); process.exit(1); } console.log(JSON.stringify({status:h.status,generation:h.generation,sha256:h.sha256}));'
          status_code="$(curl -sS --max-time 45 -o /tmp/status.json -w '%{http_code}' "$AUTH_BASE/api/status" || true)"
          if [ "$status_code" != "200" ]; then
            echo "PRODUCTION_STATUS_FAILED code=$status_code" >&2
            head -c 400 /tmp/status.json >&2 || true
            exit 1
          fi
          node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync("/tmp/status.json","utf8")); if(!s.generation || !s.sha256) { console.error(s); process.exit(1); } console.log(JSON.stringify({generation:s.generation,sha256:s.sha256}));'

      - name: Setup hosted UAT Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hosted UAT dependencies
        run: |
          python -m pip install --quiet duckdb playwright
          python -m playwright install --with-deps chromium

      - name: Hosted browser UAT
        env:
          TERMINAL_ACCESS_PATH: ${{ secrets.TERMINAL_ACCESS_PATH }}
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.PRODUCTION_URL }}"
          python scripts/uat_hosted_terminal.py \
            --url "$URL" \
            --access-path "$TERMINAL_ACCESS_PATH" \
            --out-dir artifacts/production_hosted_terminal_uat \
            --timeout 900

      - name: Upload production UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-hosted-terminal-uat
          path: artifacts/production_hosted_terminal_uat/
          if-no-files-found: ignore
