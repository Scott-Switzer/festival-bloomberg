# Festival Bloomberg — Hosted Terminal Staging Deploy
#
# Deploys the SEPARATE read-only terminal runtime (terminal-runtime/) to
# Cloudflare as festival-bloomberg-terminal-staging. Reuses the existing
# authorized Cloudflare deployment secrets already proven by build-container.yml.
# Never touches fi-acquisition-runtime.
#
# The terminal worker has NO secrets of its own (no provider credentials, no
# admin token). It serves the public read-only serving artifact.
#
# Manual trigger: gh workflow run terminal-deploy.yml --ref <branch>
# Automatic: push to main touching the terminal runtime or terminal assets.

name: Terminal Staging Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "terminal-runtime/**"
      - "python/festival_bloomberg/terminal/**"
      - "apps/terminal/mvp/**"
      - "scripts/uat_hosted_terminal.py"

permissions:
  contents: read

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: terminal-runtime/package-lock.json

      - name: Install dependencies
        working-directory: terminal-runtime
        run: npm ci

      - name: Typecheck
        working-directory: terminal-runtime
        run: npm run typecheck

      - name: Assemble deploy context
        # Wrangler uses the Dockerfile directory as the image build context.
        # Keep the generated copies out of Git; the image contains only the
        # product package and static assets, never acquisition code or secrets.
        working-directory: terminal-runtime
        run: |
          set -euo pipefail
          mkdir -p public docker
          cp -r ../apps/terminal/mvp/. public/
          cp -r ../python docker/python
          cp -r public docker/public
          cp ../requirements.txt docker/requirements.txt
          test -f public/index.html
          test -f docker/Dockerfile.terminal
          test -f docker/public/index.html
          test -f docker/requirements.txt

      - name: Deploy staging terminal (festival-bloomberg-terminal-staging)
        working-directory: terminal-runtime
        id: deploy
        run: |
          set -euo pipefail
          npx wrangler deploy --env staging 2>&1 | tee /tmp/wrangler-deploy.log
          URL="$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/wrangler-deploy.log | tail -1 || true)"
          if [ -z "$URL" ]; then
            echo "WRANGLER_URL_NOT_FOUND: deploy did not return a workers.dev URL" >&2
            exit 1
          fi
          echo "STAGING_URL=$URL"
          echo "STAGING_URL=$URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test hosted terminal
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          URL="${{ steps.deploy.outputs.STAGING_URL }}"
          echo "STAGING_URL=$URL"
          CURL_HEADERS=()
          if [ -n "${CF_ACCESS_CLIENT_ID:-}" ] && [ -n "${CF_ACCESS_CLIENT_SECRET:-}" ]; then
            CURL_HEADERS+=( -H "CF-Access-Client-Id: ${CF_ACCESS_CLIENT_ID}" )
            CURL_HEADERS+=( -H "CF-Access-Client-Secret: ${CF_ACCESS_CLIENT_SECRET}" )
          fi
          ok=""
          for i in $(seq 1 60); do
            if curl "${CURL_HEADERS[@]}" -fsS --max-time 20 "$URL/health" > /tmp/health.json 2>/dev/null; then
              ok=1
              break
            fi
            echo "waiting for terminal cold start (attempt $i)..."
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "TERMINAL_HEALTH_TIMEOUT" >&2
            curl "${CURL_HEADERS[@]}" -sS --max-time 20 "$URL/health" 2>&1 | head -5 || true
            exit 1
          fi
          cat /tmp/health.json
          curl "${CURL_HEADERS[@]}" -fsS --max-time 30 "$URL/api/status" > /tmp/status.json
          cat /tmp/status.json | head -c 1200
          echo

      - name: Setup hosted UAT Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hosted UAT dependencies
        run: |
          python -m pip install --quiet duckdb playwright
          python -m playwright install --with-deps chromium

      - name: Hosted browser UAT
        env:
          STAGING_URL: ${{ steps.deploy.outputs.STAGING_URL }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          python scripts/uat_hosted_terminal.py \
            --url "$STAGING_URL" \
            --out-dir artifacts/hosted_terminal_uat \
            --timeout 900

      - name: Upload hosted UAT evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hosted-terminal-uat
          path: artifacts/hosted_terminal_uat/
          if-no-files-found: ignore
