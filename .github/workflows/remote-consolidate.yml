name: Remote festival-intelligence consolidation

on:
  workflow_dispatch:
  push:
    branches:
      - consolidate-festival-intelligence

permissions:
  contents: write

jobs:
  consolidate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: consolidate-festival-intelligence

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add and fetch intelligence repository
        run: |
          git remote add festival-intelligence https://github.com/Scott-Switzer/festival-intelligence.git
          git fetch festival-intelligence --tags

      - name: Add intelligence subtree
        run: |
          git subtree add --prefix=intelligence festival-intelligence main -m "Consolidate festival-intelligence subtree"

      - name: Remove temporary workflow and push merged branch
        run: |
          git rm .github/workflows/remote-consolidate.yml
          git commit -m "Remove temporary remote consolidation workflow"
          git push origin HEAD:consolidate-festival-intelligence
